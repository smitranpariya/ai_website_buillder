<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - AI Website Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">AI Website Builder</a>
      <div class="d-flex">
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="container mt-4">
    <h2>Your Websites</h2>
    <div class="mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createWebsiteModal">
            + Create New Website
        </button>
    </div>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>Website Name</th>
          <th>Industry</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="website-table-body">
        <!-- Websites will be dynamically loaded here -->
      </tbody>
    </table>
  </div>
  <!-- create website modal starts -->
  <div class="modal fade" id="createWebsiteModal" tabindex="-1" aria-labelledby="createWebsiteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="create-website-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createWebsiteModalLabel">Create New Website</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="create-business-type" class="form-label">Business Type</label>
            <input type="text" class="form-control" id="create-business-type" required>
          </div>
          <div class="mb-3">
            <label for="create-industry" class="form-label">Industry</label>
            <input type="text" class="form-control" id="create-industry" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Generate</button>
        </div>
      </form>
    </div>
  </div>

  

  <!-- Edit Website Modal -->
  <div class="modal fade" id="editWebsiteModal" tabindex="-1" aria-labelledby="editWebsiteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Website</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="edit-website-form">
            <h6 class="mt-4">Website Title</h6>
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="Text" class="form-control" id="website-title">
            </div>
            <!-- Business Type -->

            <!-- Hero Section -->
            <h6 class="mt-4">Hero Section</h6>
            <div class="mb-3">
              <label class="form-label">Headline</label>
              <input type="text" class="form-control" id="hero-headline">
            </div>
            <div class="mb-3">
              <label class="form-label">Subheadline</label>
              <input type="text" class="form-control" id="hero-subheadline">
            </div>
            <!-- About -->
            <h6 class="mt-4">About Section</h6>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="website-about" rows="3"></textarea>
            </div>
  
            <!-- Services -->
            <h6 class="mt-4">Services</h6>
            <div class="mb-3">
              <label class="form-label">List services (comma-separated)</label>
              <textarea class="form-control" id="website-services" rows="2"></textarea>
            </div>
  
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Check JWT token and decode
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Please log in first.");
      window.location.href = "login.html";
    }
  
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }
  
    const payload = parseJwt(token);
    if (payload && payload.sub) {
      console.log("Logged in user:", payload.sub);
    } else {
      console.warn("Could not extract user email from token.");
    }

    // Handle Create Website Form Submission
    document.getElementById("create-website-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    const business_type = document.getElementById("create-business-type").value.trim();
    const industry = document.getElementById("create-industry").value.trim();

    if (!business_type || !industry) {
        alert("Both fields are required.");
        return;
    }

    // Disable form and show loader
    const submitBtn = document.querySelector("#create-website-form button[type='submit']");
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating...`;

    try {
        const response = await fetch("http://127.0.0.1:5001/api/ai/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ business_type, industry })
        });

        const data = await response.json();

        if (data.msg === "Website generated successfully" || data._id) {
            alert("Website created!");

            // Hide modal after alert is dismissed
            setTimeout(() => {
                const modalEl = bootstrap.Modal.getInstance(document.getElementById("createWebsiteModal"));
                modalEl.hide();

                // Refresh table (if you have a loadWebsites() function, call it here)
                if (typeof loadWebsites === "function") {
                    loadWebsites();  // Use this if your table is dynamic
                } else {
                    location.reload();  // fallback
                }

                // Reset form
                document.getElementById("create-website-form").reset();
            }, 300); // Slight delay for alert acknowledgment
        } else {
            alert(data.msg || "Something went wrong while creating website.");
        }
    } catch (err) {
        console.error("Create website error:", err);
        alert("Error generating website.");
    } finally {
        // Re-enable form and reset button
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Create Website";
    }
});

  
    // Fetch user websites
    fetch("http://127.0.0.1:5001/api/website/all", {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + token
      }
    })
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById("website-table-body");
  
      if (Array.isArray(data) && data.length > 0) {
        data.forEach(site => {
          const row = `
            <tr>
              <td>${site.business_type || 'Untitled'}</td>
              <td>${site.industry || '-'}</td>
              <td>${new Date(site.created_at || Date.now()).toLocaleDateString()}</td>
              <td>
                <a href="api/preview/${site._id}" class="btn btn-sm btn-info" target="_blank">View</a>
                <button class="btn btn-sm btn-warning btn-edit" data-website-id="${site._id}">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteWebsite('${site._id}')">Delete</button>
              </td>
            </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="4">No websites found.</td></tr>`;
      }
    })
    .catch(err => {
      console.error("Fetch error:", err);
      alert("Failed to load websites");
    });
  
    // Delete website
    function deleteWebsite(id) {
      if (!confirm("Are you sure you want to delete this website?")) return;
  
      fetch(`http://127.0.0.1:5001/api/website/${id}`, {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + token
        }
      })
      .then(res => res.json())
      .then(data => {
        alert(data.msg || "Website deleted successfully.");
        location.reload();
      })
      .catch(err => {
        console.error("Delete error:", err);
        alert("Error deleting website");
      });
    }
  
    // Logout
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/login";
    }
  
    // Edit Modal Trigger with Event Delegation
    document.getElementById("website-table-body").addEventListener("click", function(event) {
      if (event.target.classList.contains("btn-edit")) {
        const websiteId = event.target.getAttribute("data-website-id");
        console.log("Edit clicked for:", websiteId);
        openEditModal(websiteId);
      }
    });
  
    // Open Edit Modal
    function parseWrappedJsonString(str) {
        // Remove leading '''json or ''' and trailing '''
        if (str.startsWith("'''json")) {
            str = str.replace(/^'''json\s*/i, '').trim();
        } else if (str.startsWith("'''")) {
            str = str.replace(/^'''\s*/i, '').trim();
        }

        if (str.endsWith("'''")) {
            str = str.slice(0, -3).trim();
        }

        try {
            return JSON.parse(str);
        } catch (err) {
            console.error("Failed to parse content:", str);
            return null;
        }
    }

    function openEditModal(websiteId) {
        fetch(`http://127.0.0.1:5001/api/website/${websiteId}`, {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(res => res.json())
        .then(data => {
            let content = {};
            try {
                let rawContent = data.content || '';

                // Clean the raw content (remove the markdown code block markers)
                if (rawContent.trim().startsWith("```json")) {
                    rawContent = rawContent.replace("```json", "").replace("```", "").trim();
                }

                // Parse the cleaned content into a JavaScript object
                content = JSON.parse(rawContent);
            } catch (e) {
                console.error("Failed to parse content:", e);
                alert("Unable to parse website content.");
                return;
            }

            // Ensure all the elements exist before trying to set their values
            const websiteTitle = document.getElementById("website-title");
            const heroHeadline = document.getElementById("hero-headline");
            const heroSubheadline = document.getElementById("hero-subheadline");
            const websiteAbout = document.getElementById("website-about");
            const websiteServices = document.getElementById("website-services");

            // Check if the elements exist before trying to set their values
            if (websiteTitle) websiteTitle.value = content.title || '';
            if (heroHeadline) heroHeadline.value = content.hero?.headline || '';
            if (heroSubheadline) heroSubheadline.value = content.hero?.subheadline || '';
            if (websiteAbout) websiteAbout.value = content.about || '';
            if (websiteServices) websiteServices.value = Array.isArray(content.services)
                ? content.services.join(", ")
                : '';

            // Attach the submit handler for the form
            const form = document.getElementById("edit-website-form");
            if (form) {
                form.onsubmit = function (e) {
                    e.preventDefault();
                    updateWebsite(websiteId);
                };
            } else {
                console.error("Form element not found.");
            }

            // Show the edit modal
            const modalElement = document.getElementById('editWebsiteModal');
            if (modalElement) {
                new bootstrap.Modal(modalElement).show();
            } else {
                console.error("Modal element not found.");
            }
        })
        .catch(err => {
            console.error("Failed to fetch website", err);
            alert("Unable to fetch website details.");
        });
    }

    // Update Website
    function updateWebsite(websiteId) {
        // Gather the updated content from the modal form
        const updatedContent = {
            title: document.getElementById("website-title").value,
            hero: {
                headline: document.getElementById("hero-headline").value,
                subheadline: document.getElementById("hero-subheadline").value
            },
            about: document.getElementById("website-about").value,
            services: document.getElementById("website-services").value.split(",").map(service => service.trim())
        };

        // Validate if the structure is correct
        if (!updatedContent.title || !updatedContent.hero.headline || !updatedContent.hero.subheadline || !updatedContent.about || !Array.isArray(updatedContent.services)) {
            alert("Please fill out all fields correctly.");
            return;
        }

        // Send the updated content to the backend
        fetch(`http://127.0.0.1:5001/api/website/${websiteId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(updatedContent)  // No 'content' wrapper here
        })
        .then(response => response.json())
        .then(data => {
            if (data.msg === "Content updated successfully") {
                alert("Website updated successfully!");
                // Optionally, close the modal here
                const modal = bootstrap.Modal.getInstance(document.getElementById('editWebsiteModal'));
                modal.hide();
            } else {
                alert(`Error: ${data.msg}`);
            }
        })
        .catch(err => {
            console.error("Error updating website:", err);
            alert("An error occurred while updating the website.");
        });
    }






  </script>
  


</body>
</html>
